[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
test = "test"
script = "script"
solc_version = "0.8.24"
# QIE is an EVM-compatible Cosmos chain. We compile for "paris" (no PUSH0) so the
# bytecode is safe on any EVM implementation, regardless of Shanghai/Cancun support.
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
  "@openzeppelin/=node_modules/@openzeppelin/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read-write", path = "../deployments" }]

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 32

[rpc_endpoints]
qie_testnet = "${QIE_TESTNET_RPC}"
qie_mainnet = "${QIE_MAINNET_RPC}"
